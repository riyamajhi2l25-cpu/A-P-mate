var chapters=[
{sem:1,t:"Cell - The Living Factory",e:"🧬",c:"bg-gradient-to-br from-pink-500 to-fuchsia-600",short:"Your body has 37 trillion cells! Each is a tiny factory.",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-5'><p class='text-[11px] font-bold text-pink-400 tracking-widest'>DIAGRAM - ANIMAL CELL</p><div class='mt-4 flex justify-center'><div class='relative w-64 h-36 border-2 border-pink-400/80 rounded-full'><div class='absolute -top-2 left-8 bg-violet-600 px-3 py-1 rounded-full text-[9px] font-bold'>NUCLEUS DNA 🧠 Brain</div><div class='absolute top-1/2 -left-2 bg-blue-500 px-2 py-1 rounded-full text-[8px]'>Ribosome Factory</div><div class='absolute bottom-2 right-10 bg-yellow-400 text-black px-3 py-1 rounded-full text-[9px] font-bold'>Mito ATP ⚡ Powerhouse</div><div class='absolute top-8 right-6 w-2 h-2 bg-green-400 rounded-full animate-pulse'></div></div></div><p class='text-[10px] text-zinc-500 mt-6 text-center'>Phospholipid bilayer = Security gate • Semi-permeable • Proteins as doors</p></div>",exp:"Imagine your body is a city, cell is the house! 37.2 trillion houses. Each house has: Outer wall (membrane) = security gate only allows selected people, Jelly inside (cytoplasm) = with machines (organelles), Control room (nucleus) = has blueprint DNA. Fun: If you stretch DNA of ONE cell, it's 2 meters long! You make 2 million new blood cells per second.",pts:["Membrane: Phospholipid bilayer + proteins = security gate model, only selected entry","Mitochondria: Powerhouse makes ATP energy currency, has own DNA, more in muscle heart","Nucleus: Brain, has chromosomes 46 (23 pairs), nucleolus makes ribosome","Transport: Passive high to low no energy (diffusion osmosis), Active low to high needs ATP Na/K pump","Ribosome: Protein factory, RER rough makes protein, SER smooth makes lipid detox","Clinical: Cancer = uncontrolled division, Mito disease = fatigue low energy"],trick:"PMR - Powerhouse Mito, Manufacturing Ribosome, Regulation Nucleus"},
{sem:1,t:"Tissues - Team Work",e:"🧫",c:"bg-gradient-to-br from-orange-400 to-amber-600",short:"Same cells doing same work = Tissue. 4 teams only!",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4'><p class='text-[11px] font-bold text-orange-400'>4 TYPES VISUAL</p><div class='grid grid-cols-2 gap-2 mt-3 text-[10px]'><div class='bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-center'><div class='text-lg'>🧱🧱🧱</div><b>Epithelial</b><br>Covers surfaces<br>Protection + absorption</div><div class='bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-center'><div class='text-lg'>🔗</div><b>Connective</b><br>Connects supports<br>Blood Bone Fat</div><div class='bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-center'><div class='text-lg'>💪</div><b>Muscular</b><br>Moves body<br>Contracts</div><div class='bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-center'><div class='text-lg'>⚡</div><b>Nervous</b><br>Controls<br>Conducts impulse</div></div></div>",exp:"Tissue = group of similar cells doing same job, like same department in office. Epithelial = covering team (skin, intestine lining), Connective = support team (blood, bone, fat, cartilage), Muscular = movement team, Nervous = control team. Basement membrane glues epithelium to connective.",pts:["Simple epithelium 1 layer: Alveoli lungs, intestine for absorption","Stratified many layers: Skin protection from wear tear","Connective most diverse: Blood fluid, Bone hard, Cartilage semi-hard, Fat adipose","Tight junction seals, Gap junction communication","Exocrine via duct salivary, Endocrine no duct thyroid into blood","Carcinoma epithelial cancer, Sarcoma connective cancer"],trick:"ECMN - Epithelial Covering, Connective Connecting, Muscular Moving, Nervous Networking"},
{sem:1,t:"Skeletal - Your 206 Bones",e:"🦴",c:"bg-gradient-to-br from-zinc-100 to-zinc-300 text-black",short:"Axial 80 (centre) + Appendicular 126 (limbs) = 206. Femur strongest.",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4 font-mono text-[10px]'><p class='font-sans font-bold text-zinc-300 tracking-widest text-[11px]'>LONG BONE CUT SECTION</p><div class='mt-3 border-l-2 border-zinc-600 pl-3 leading-7 text-zinc-300'>Epiphysis - Ends - Spongy bone + Red marrow → Makes blood<br>Articular cartilage → Reduces friction<br>Metaphysis - Growth plate → Increases length in kids<br>Diaphysis - Shaft - Compact bone + Yellow marrow fat<br>Periosteum - Outer fibrous → Has osteoblasts → Pain sensitive!</div><div class='mt-4 flex gap-2 font-sans'><span class='bg-green-900/50 border border-green-800 px-2 py-1 rounded-full'>Osteoblast Builds</span><span class='bg-red-900/50 border border-red-800 px-2 py-1 rounded-full'>Osteoclast Eats</span></div></div>",exp:"Skeleton = your body's scaffolding! 4 functions: Shape + Protection (skull protects brain, ribs heart lungs) + Blood making in red marrow + Calcium store. Axial = central pole 80 bones, Appendicular = hanging limbs 126. Long bones grow from cartilage via endochondral ossification. Flat bones skull from membrane via intramembranous.",pts:["Osteoblast builds new bone, Osteoclast breaks old (remodeling), Osteocyte mature maintains","Red marrow in sternum pelvis vertebra in adult makes blood, Yellow stores fat","Calcium + Vit D + Exercise + Sex hormones = strong bone","Joints: Fibrous skull immovable, Cartilaginous spine slight, Synovial knee free movable fluid","Bone types Long femur, Short carpals, Flat skull, Irregular vertebra","Osteoporosis low density fracture, Greenstick fracture kids"],trick:"206 = Skull 22 + Ear 6 + Hyoid 1 + Vertebrae 26 + Ribs 24 + Sternum 1 + 64 upper + 62 lower"},
{sem:1,t:"Muscles - Sliding Filaments",e:"💪",c:"bg-gradient-to-br from-red-500 to-orange-600",short:"Actin + Myosin slide over each other = you move!",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4'><p class='text-[11px] font-bold text-red-400'>SLIDING FILAMENT - HOW YOU MOVE</p><div class='mt-4 flex items-center justify-center gap-2'><div class='bg-blue-500 h-6 w-24 rounded-full flex items-center justify-center text-[8px] font-bold text-black'>ACTIN Thin</div><div class='text-xl'>🤝</div><div class='bg-red-500 h-6 w-24 rounded-full flex items-center justify-center text-[8px] font-bold'>MYOSIN Thick Head</div></div><div class='mt-4 bg-zinc-900 p-3 rounded-xl text-[10px] leading-5'>Step 1: Nerve → Ca++ released from SR<br>Step 2: Ca++ binds Troponin → Tropomyosin moves away<br>Step 3: Myosin head grabs actin<br>Step 4: Power stroke uses ATP → Sarcomere shortens → Muscle contracts!</div></div>",exp:"Muscle converts chemical ATP to movement. 3 types: Skeletal voluntary you control striated multinucleated attached to bone via tendon, Cardiac involuntary only heart branched intercalated discs gap junctions fast conduction no fatigue, Smooth involuntary organs spindle slow sustained peristalsis. Motor unit = 1 neuron + fibers it controls.",pts:["Skeletal voluntary striated multinucleated fatigues","Cardiac involuntary branched intercalated discs gap junctions no fatigue","Smooth involuntary spindle single nucleus organs slow","Sarcomere Z to Z functional unit, A band same, H I decrease on contraction","Needs Calcium from SR + ATP for power stroke detachment","Myasthenia gravis antibodies destroy ACh receptors weakness"],trick:"OIA - Origin fixed, Insertion moves, Action work. MRS - Myosin thick, Actin thin"},
{sem:2,t:"Heart - 4 Chambers Pump",e:"❤️",c:"bg-gradient-to-br from-red-600 to-pink-600",short:"Pumps 7000L/day! Right to lungs, left to body.",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4'><p class='text-[11px] font-bold text-red-400'>HEART FLOW - DOUBLE CIRCULATION</p><div class='grid grid-cols-2 gap-2 mt-3 text-[10px] text-center'><div class='bg-red-950/80 border border-red-800 p-3 rounded-xl'>RA<br>DeO2 from body<br>SVC IVC<br>→ Tricuspid → RV</div><div class='bg-red-950/80 border border-red-800 p-3 rounded-xl'>LA<br>O2 from lungs<br>Pulmonary veins<br>→ Bicuspid → LV</div><div class='bg-gradient-to-br from-red-900 to-red-800 border border-red-600 p-3 rounded-xl font-bold'>RV → Lungs via Pulmonary Artery (DeO2)</div><div class='bg-gradient-to-br from-red-900 to-red-800 border border-red-600 p-3 rounded-xl font-bold'>LV → Body via Aorta (O2) Wall THICKEST</div></div><p class='text-[9px] text-zinc-500 mt-3 text-center'>Lub = AV valves close, Dub = SL valves close • SA node → AV node (0.1s delay) → His → Purkinje</p></div>",exp:"Heart = fist size 300g, pumps 5L/min, 7000L/day, beats 100k/day! Right side dirty blood to lungs for O2, left side clean blood to whole body. Septum no mixing. Pericardium cover. Cardiac output = HR 72 x SV 70ml = 5L. SA node natural pacemaker 60-100/min, AV node delay ensures atria contract first.",pts:["Conduction SA → AV delay → Bundle His → Purkinje → ventricles","ECG P atrial depolarization QRS ventricular T ventricular repolarization","Blood plasma 55% proteins albumin globulin fibrinogen + cells 45% RBC 5M 120 days Hb 4 O2","ABO Rh groups: A has A antigen B antibody, AB universal recipient O universal donor","Cardiac cycle systole ejection diastole filling","MI heart attack coronary block, HTN >140/90 silent killer"],trick:"Never Trust Aorta Pulmonary Valve - Tricuspid Right 3 cusps, Bicuspid Left 2 cusps. SA node 60-100"},
{sem:2,t:"Vessels & Lymph - Highways",e:"🩸",c:"bg-gradient-to-br from-rose-500 to-red-700",short:"Artery away thick, Vein towards thin valves, Capillary 1 cell exchange.",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4 flex gap-3 text-[10px]'><div class='flex-1 bg-red-950 border border-red-800 p-3 rounded-xl'><b class='text-red-300'>ARTERY</b><br>Wall THICK<br>Tunica intima media externa<br>High pressure Deep<br>No valves Pulse felt<br>Carries O2 except pulmonary</div><div class='flex-1 bg-blue-950 border border-blue-800 p-3 rounded-xl'><b class='text-blue-300'>VEIN</b><br>Wall THIN<br>Large lumen<br>Low pressure Superficial<br>HAS VALVES<br>Carries DeO2 except pulmonary</div></div><div class='mt-3 bg-zinc-800 p-2 rounded-xl text-[10px] text-center'>Capillary 1 cell thick 8 micron RBC single file • 10 billion capillaries! • Site of exchange</div>",exp:"Arteries take away from heart (A away), Veins bring towards heart. Capillaries where O2 food waste exchange via diffusion. Lymph drains extra 2-3L/day back to blood filters via lymph nodes swelling = infection. Spleen largest lymph filters blood stores RBC platelets.",pts:["Artery TIE intima endothelium media smooth muscle elastic externa connective","Vein thin large lumen valves muscle pump respiratory pump helps return","Capillary continuous brain, fenestrated pores kidney, sinusoid large gaps liver","Lymph 2-3L/day thoracic duct left right lymphatic duct → subclavian vein","Lymph nodes filter swelling infection, spleen filters blood, MALT mucosa","Varicose valve failure tortuous, Edema low protein lymph block"],trick:"Artery Away Vein Towards. TIE - Intima Endothelium Media Muscle Externa connective"},
{sem:2,t:"Lungs - 480M Alveoli",e:"🫁",c:"bg-gradient-to-br from-sky-400 to-blue-600",short:"480 million alveoli = tennis court area! Surfactant prevents collapse.",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4 text-[10px] leading-6'><p class='font-bold text-sky-400'>RESPIRATORY TREE</p>Nose warms 37C filters humidifies → Pharynx common → Larynx voice box vocal cords → Trachea 12cm 16-20 C-rings → Bronchi Right wider shorter vertical (foreign body goes right!) → Bronchioles no cartilage smooth muscle → Alveoli 480M 70 sq m<br><br><div class='flex gap-2'><span class='bg-zinc-800 px-2 py-1 rounded-full'>Type1 flat exchange</span><span class='bg-yellow-900/30 border border-yellow-700 px-2 py-1 rounded-full'>Type2 surfactant</span><span class='bg-green-900/30 border border-green-700 px-2 py-1 rounded-full'>Macrophage dust</span></div></div>",exp:"Respiration 4 steps: Ventilation breathing in out + external alveoli blood exchange + internal blood tissue + cellular mitochondria O2 use. Surfactant dipalmitoyl lecithin made by Type2 reduces surface tension prevents collapse during expiration - absent in premature RDS. Diaphragm main 75% breathing phrenic nerve C3-5 keeps diaphragm alive!",pts:["Tidal 500ml IRV 3000 ERV 1100 Residual 1200 VC 4500 Total 6000 Dead space 150","Inspiration active diaphragm contracts volume up pressure down air in, expiration passive","Hemoglobin 4 heme 1g Hb 1.34ml O2 15g per 100ml 20ml O2 S-curve high affinity lungs low tissues","CO2 70% bicarbonate 20% carbamino 7% dissolved chloride shift","Control medulla rhythmicity pons apneustic pneumotaxic chemoreceptors central CO2 peripheral O2","Asthma bronchoconstriction wheezing, COPD emphysema alveoli destroyed, Pneumonia fluid"],trick:"TIRE - Tidal 500 IRV 3L Residual 1.2L ERV 1.1L. Right bronchus wider shorter vertical foreign body right"},
{sem:3,t:"Digestive - 9m Journey",e:"🍔",c:"bg-gradient-to-br from-yellow-400 to-orange-500 text-black",short:"Mouth to anus 9 meters! Liver 1.5kg largest gland.",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4 text-white text-[10px] leading-6'><p class='font-bold text-yellow-400'>FOOD JOURNEY 24-72 HOURS</p>Mouth Teeth 32 chewing + Saliva amylase ptyalin starch maltose lysozyme 1.5L/day<br>Esophagus 25cm Peristalsis wave 8-10 sec 3 constrictions<br>Stomach 1.5L Fundus Body Antrum Pylorus 3 muscle layers HCl pH2 Pepsin protein Mucus protects<br>Duodenum 25cm C-shaped Bile emulsifies fat + Pancreas amylase trypsin lipase bicarbonate alkaline<br>Jejunum Villi 600x area absorbs via blood fat via lacteal lymph</div>",exp:"Digestion mechanical chewing churning segmentation + chemical enzymes break big to small. Liver largest gland right hypochondrium makes bile stored gallbladder emulsifies fat stores glycogen detox makes albumin clotting factors Kupffer phagocytosis. Pancreas both exocrine enzymes and endocrine insulin glucagon. Villi finger projections lacteal for fat increase area 600x!",pts:["Mouth 32 teeth incisors 8 canine 4 premolar 8 molar 12 salivary parotid submandibular sublingual","Stomach parietal HCl + Intrinsic factor B12 chief pepsinogen mucous mucus G gastrin","Liver 4 lobes portal triad hepatic artery portal vein bile duct functions bile glycogen detox albumin","Pancreas exocrine acini 98% amylase trypsin lipase bicarbonate pH8 endocrine islets alpha glucagon beta insulin","Small intestine villi microvilli brush border lactase sucrase maltase peptidase active transport","Peptic ulcer HCl H pylori, Gallstone cholesterol, Jaundice bilirubin, Cirrhosis fibrosis"],trick:"MESA JDICR - Mouth Esophagus Stomach Duodenum Jejunum Ileum Colon Rectum. Bile NO enzyme only emulsifies"},
{sem:3,t:"Kidney - Filters 180L Daily",e:"🫘",c:"bg-gradient-to-br from-amber-500 to-orange-700",short:"Filters 180L makes 1.5L urine. 1M nephrons per kidney!",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4 font-mono text-[10px] text-white'><p class='font-sans font-bold text-amber-400 tracking-widest'>NEPHRON - FUNCTIONAL UNIT</p><div class='mt-2 leading-6'>Glomerulus fenestrated → Bowman's capsule filtration barrier<br>↓ 180L/day<br>PCT 65% reabsorb brush border Na glucose amino acid<br>↓<br>Loop Henle Desc water permeable Asc Na-K-2Cl countercurrent<br>↓<br>DCT fine tuning PTH Ca Aldosterone Na<br>↓<br>Collecting duct ADH water aquaporin 2 → Urine 1.5L</div></div>",exp:"Kidney 150g bean shaped retroperitoneal cortex outer granular medulla inner pyramids pelvis collects. Functions: filter blood, regulate water electrolytes pH, BP via renin angiotensin aldosterone, RBC via EPO, Vit D activation. GFR 125ml/min 180L/day 99% reabsorbed. Juxtaglomerular apparatus macula densa senses Na JG cells renin.",pts:["GFR 125 180L filtered filtration fraction 20% barrier prevents protein proteinuria damage","PCT 65% Na water glucose amino HCO3 brush border PTH inhibits phosphate","Loop Desc water permeable concentrates Asc thick Na-K-2Cl dilutes countercurrent multiplier 1200 mOsm","DCT PTH Ca Aldosterone Na K Thiazide diuretic here","CD principal ADH aquaporin 2 water intercalated acid base ADH deficiency diabetes insipidus polyuria","JGA macula densa low Na → renin → angiotensin II vasoconstrictor aldosterone ADH BP up, Stone calcium oxalate"],trick:"GFR 125 180L 99% reabsorbed. PCT 65% Loop 25% DCT 5% CD 4% ADH water Aldosterone salt"},
{sem:4,t:"Endocrine - Hormone Network",e:"🧠",c:"bg-gradient-to-br from-purple-500 to-violet-700",short:"Pituitary master in sella turcica. Feedback like AC thermostat!",vis:"<div class='bg-black border border-zinc-800 rounded-2xl p-4 text-white text-[10px] leading-6'><p class='font-bold text-purple-400'>HORMONE AXIS - FEEDBACK</p>Hypothalamus releasing TRH CRH GnRH GHRH → Pituitary<br>Anterior via portal: TSH → Thyroid T3 T4 metabolism ↑, ACTH → Adrenal cortisol stress, FSH LH → Gonads, GH growth, Prolactin milk<br>Posterior via nerves stores: ADH water, Oxytocin love labour milk<br><br>Negative: High T3 T4 → inhibits hypothalamus pituitary → low TSH → normal like AC off when cold<br>Positive: Oxytocin labour baby pushes → more oxytocin → more contraction till delivery</div></div>",exp:"Endocrine ductless into blood distant target via receptors. Slow long low ng/ml feedback. Pituitary master 0.5g sella turcica anterior glandular via portal posterior neural stores ADH oxytocin made hypothalamus. Thyroid T3 T4 needs iodine BMR. Parathyroid PTH raises calcium. Adrenal cortex cortisol aldosterone androgens medulla adrenaline noradrenaline emergency. Pancreas insulin glucagon. Pineal melatonin sleep.",pts:["Hypothalamus pituitary axis TRH TSH thyroid, CRH ACTH cortisol, GnRH FSH LH gonads, GHRH GH","Thyroid T3 T4 iodine tyrosine colloid follicles BMR iodine deficiency goiter hypothyroid cretinism myxedema","Adrenal cortex glomerulosa aldosterone Na water K BP fasciculata cortisol stress glucose anti inflammatory reticularis DHEA medulla adrenaline fight flight","Pancreas beta insulin lowers GLUT4 glycogen alpha glucagon raises glycogenolysis delta somatostatin","Pituitary GH excess gigantism kids acromegaly adults dwarfism ADH deficiency diabetes insipidus","Negative 99% high inhibits, Positive labour clotting LH surge ovulation"],trick:"FAST vs SLOW - Nervous fast short electric, Endocrine slow long chemical. T3 T4 need iodine"},

function showTab(t){
 document.getElementById('tab-learn').classList.add('hidden');
 document.getElementById('tab-quiz').classList.add('hidden');
 document.getElementById('tab-flash').classList.add('hidden');
 document.getElementById('tab-friends').classList.add('hidden');
 document.getElementById('tab-chat').classList.add('hidden');
 document.getElementById('tab-settings').classList.add('hidden');
 document.getElementById('tab-'+t).classList.remove('hidden');
 ['learn','quiz','flash','friends','chat','settings'].forEach(x=>{
  var b=document.getElementById('b-'+x);
  if(b) b.className = (x===t)?"bg-white text-black px-5 py-2 rounded-full text-sm font-bold":"bg-zinc-800 px-5 py-2 rounded-full text-sm";
 });
 window.scrollTo(0,0);
}
function filterS(s){
 curSem=s;
 ['all','1','2','3','4','5','6'].forEach(x=>{
  var b=document.getElementById('f-'+x);
  if(b) b.className = (x===s)?"bg-violet-600 px-4 py-1.5 rounded-full text-xs font-bold":"bg-zinc-800 px-4 py-1.5 rounded-full text-xs";
 });
 render();
}
function render(){
 var list = curSem==='all'?chapters:chapters.filter(c=>c.sem==curSem);
 document.getElementById('grid').innerHTML = list.map(c=>{
  var idx = chapters.indexOf(c);
  return `<div onclick="openC(${idx})" class="bg-zinc-900 border border-zinc-800 p-4 rounded-[20px] cursor-pointer hover:border-zinc-700 transition">
   <div class="flex gap-3"><div class="w-12 h-12 rounded-xl ${c.c} flex items-center justify-center text-xl shrink-0">${c.e}</div>
   <div class="flex-1"><div class="flex gap-2 items-center"><span class="text-[9px] bg-zinc-800 px-2 py-0.5 rounded-full text-zinc-400">SEM ${c.sem}</span><span class="text-[9px] bg-violet-900/30 border border-violet-800 px-2 py-0.5 rounded-full text-violet-300">Visual + Fun</span></div>
   <p class="font-bold text-[14px] mt-1 leading-5">${c.t}</p><p class="text-xs text-zinc-400 mt-1 leading-5">${c.short}</p></div></div></div>`;
 }).join('');
}
render();

function openC(i){
 var c=chapters[i];
 document.getElementById('mContent').innerHTML = `
 <div class="flex gap-3 items-center"><div class="w-14 h-14 ${c.c} rounded-2xl flex items-center justify-center text-2xl">${c.e}</div><div><h2 class="text-xl font-bold leading-6">${c.t}</h2><p class="text-xs text-zinc-500 mt-1">Semester ${c.sem} • Deep Visual • Fun + Informative</p></div></div>
 <div class="mt-6">${c.vis}</div>
 <div class="mt-6"><p class="font-bold">📘 Easy Explanation (Fun):</p><p class="text-sm text-zinc-300 mt-2 leading-7">${c.exp}</p></div>
 <div class="mt-6"><p class="font-bold text-sm">🎯 6 High-Yield Points:</p><div class="mt-3 space-y-2">${c.pts.map(p=>`<div class="bg-zinc-800 border border-zinc-700 p-3 rounded-xl text-sm leading-6">• ${p}</div>`).join('')}</div></div>
 <div class="mt-6 grid grid-cols-2 gap-3">
 <div class="bg-violet-900/20 border border-violet-800 p-4 rounded-2xl"><p class="text-[11px] font-bold text-violet-400">💡 Trick</p><p class="text-sm mt-2 leading-5">${c.trick}</p></div>
 <div class="bg-yellow-900/20 border border-yellow-800 p-4 rounded-2xl"><p class="text-[11px] font-bold text-yellow-400">🤩 Fun Fact</p><p class="text-sm mt-2 leading-5">${c.short}</p></div>
 </div>
 <div class="mt-6 p-4 bg-zinc-800 rounded-2xl"><p class="text-xs font-bold">⚠️ Clinical</p><p class="text-xs text-zinc-400 mt-2 leading-5">${c.pts[c.pts.length-1]}</p></div>
 `;
 document.getElementById('modal').style.display='block';
}

var qi=0;
function renderQuiz(){
 var c=chapters[qi];
 document.getElementById('quizBox').innerHTML = `<p class="text-xs text-zinc-500 font-bold">Q ${qi+1}/${chapters.length} • ${c.t}</p><p class="font-bold mt-3 text-[16px]">Which is TRUE about ${c.t}?</p><div class="mt-5 space-y-3"><button onclick="checkQ(true)" class="w-full text-left bg-zinc-800 border border-zinc-700 p-4 rounded-xl text-sm hover:bg-zinc-700">✅ ${c.pts[0]}</button><button onclick="checkQ(false)" class="w-full text-left bg-zinc-800 border border-zinc-700 p-4 rounded-xl text-sm hover:bg-zinc-700">❌ No function vestigial</button><button onclick="checkQ(false)" class="w-full text-left bg-zinc-800 border border-zinc-700 p-4 rounded-xl text-sm hover:bg-zinc-700">❌ Only in plants</button></div><div class="mt-6 flex gap-2"><button onclick="qi=(qi-1+chapters.length)%chapters.length;renderQuiz()" class="bg-zinc-800 px-5 py-2 rounded-full text-xs">Prev</button><button onclick="qi=(qi+1)%chapters.length;renderQuiz()" class="bg-white text-black px-5 py-2 rounded-full text-xs font-bold">Next</button></div><p class="text-[11px] text-zinc-500 mt-4">Hint: ${c.trick}</p>`;
}
function checkQ(ok){ alert(ok?'✅ Correct! Great!':'❌ Wrong - read chapter again'); if(ok){ qi=(qi+1)%chapters.length; renderQuiz(); } }
renderQuiz();

function renderFlash(){
 document.getElementById('flashBox').innerHTML = chapters.map(c=>`<div onclick="this.querySelector('.ans').classList.toggle('hidden')" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 cursor-pointer hover:border-zinc-700"><p class="font-bold text-sm">${c.e} ${c.t}</p><p class="text-xs text-zinc-500 mt-1">Tap to reveal • ${c.trick}</p><div class="ans hidden mt-3 bg-violet-600 p-3 rounded-xl text-sm">${c.pts[0]}<br><br><span class="text-[11px] opacity-80">${c.exp.slice(0,180)}...</span></div></div>`).join('');
}
renderFlash();

function saveN(){
 var n=document.getElementById('nInput').value.trim().toLowerCase().replace(/\s/g,'');
 if(n && n.length<3){ alert('Min 3 letters'); return; }
 myNick=n; localStorage.setItem('nick',myNick);
 document.getElementById('idShow').innerHTML = 'ID: '+myId+'<br>'+(myNick?'Nickname: <b class="text-violet-400">'+myNick+'</b>':'No nickname - anonymous');
 alert(n?'Saved: '+n:'Removed nickname');
}
document.getElementById('idShow').innerHTML = 'ID: '+myId+'<br>'+(myNick?'Nickname: '+myNick:'No nickname set');
document.getElementById('nInput').value = myNick;

function addF(){
 var n=document.getElementById('sInput').value.trim().toLowerCase();
 if(!n){ alert('Type nickname'); return; }
 var list=JSON.parse(localStorage.getItem('friends')||'[]');
 if(list.find(f=>f.nickname===n)){ alert('Already added'); return; }
 list.push({uid:'id_'+n,nickname:n});
 localStorage.setItem('friends',JSON.stringify(list));
 document.getElementById('sInput').value='';
 renderF();
}
function renderF(){
 var list=JSON.parse(localStorage.getItem('friends')||'[]');
 document.getElementById('fList').innerHTML = list.length?list.map(f=>`<div class="flex justify-between items-center bg-zinc-800 p-3 rounded-xl mb-2"><span class="font-bold text-sm">${f.nickname}</span><button onclick="openP('${f.uid}','${f.nickname}')" class="bg-violet-600 px-3 py-1 rounded-full text-xs font-bold">Chat</button></div>`).join(''):'<p class="text-zinc-500">No friends yet. Add any nickname (offline works)</p>';
}
renderF();

function sendG(){
 var t=document.getElementById('gInput').value.trim(); if(!t) return;
 var arr=JSON.parse(localStorage.getItem('gMsgs')||'[]');
 arr.push({nick:myNick||myId,text:t});
 localStorage.setItem('gMsgs',JSON.stringify(arr));
 document.getElementById('gInput').value='';
 renderG();
}
function renderG(){
 var arr=JSON.parse(localStorage.getItem('gMsgs')||'[]');
 document.getElementById('gMsgs').innerHTML = arr.length?arr.map(m=>`<div><b class="text-violet-400">${m.nick}:</b> ${m.text}</div>`).join(''):'<p class="text-zinc-600 text-xs">No messages yet. Start discussion!</p>';
 document.getElementById('gMsgs').scrollTop = document.getElementById('gMsgs').scrollHeight;
}
renderG();

function openP(uid,nick){ selFriend=uid; document.getElementById('pWith').innerHTML=nick; renderP(); showTab('chat'); }
function sendP(){
 if(!selFriend){ alert('Select friend in Friends tab'); return; }
 var t=document.getElementById('pInput').value.trim(); if(!t) return;
 var key='chat_'+[myId,selFriend].sort().join('_');
 var arr=JSON.parse(localStorage.getItem(key)||'[]');
 arr.push({from:myId,text:t});
 localStorage.setItem(key,JSON.stringify(arr));
 document.getElementById('pInput').value='';
 renderP();
}
function renderP(){
 if(!selFriend) return;
 var key='chat_'+[myId,selFriend].sort().join('_');
 var arr=JSON.parse(localStorage.getItem(key)||'[]');
 document.getElementById('pMsgs').innerHTML = arr.map(m=>`<div class="${m.from===myId?'text-right':''}"><span class="inline-block px-3 py-1.5 rounded-xl text-xs ${m.from===myId?'bg-violet-600':'bg-zinc-800'}">${m.text}</span></div>`).join('') || '<p class="text-zinc-600 text-xs">No messages</p>';
 document.getElementById('pMsgs').scrollTop = document.getElementById('pMsgs').scrollHeight;
}
